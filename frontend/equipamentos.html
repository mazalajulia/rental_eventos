<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Equipamentos - Rental Eventos</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- MENU LATERAL -->
    <aside class="sidebar">

        <h2>Rental Eventos</h2>

        <nav>
            <a href="inicio.html">Início</a>
            <a href="equipamentos.html" class="ativo">Equipamentos</a>
            <a href="movimentacoes.html">Movimentações</a>
            <a href="perfil.html">Perfil</a>
        </nav>

        <a href="index.html" class="logout">
            Sair
        </a>

    </aside>


    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main-content">

        <!-- TOPO -->
        <header class="topbar">

            <div class="search-box">
                <span>🔍</span>

                <input
                    type="text"
                    id="campoBusca"
                    placeholder="Pesquisar equipamento..."
                >
            </div>

            <div class="perfil-topo">
                <span>JULIA</span>
            </div>

        </header>


        <!-- TÍTULO -->
        <section class="page-header">

            <div>
                <h1>Equipamentos</h1>
                <p>Gerencie os equipamentos disponíveis para locação.</p>
            </div>

            <button
                class="btn-primary"
                onclick="abrirFormulario()"
            >
                + Novo equipamento
            </button>

        </section>


        <!-- TABELA -->
        <section class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Marca</th>
                        <th>Modelo</th>
                        <th>Categoria</th>
                        <th>Disponível</th>
                        <th>Mínimo</th>
                        <th>Ações</th>
                    </tr>

                </thead>

                <tbody id="listaEquipamentos">

                    <!-- Os equipamentos serão carregados pelo JavaScript -->

                </tbody>

            </table>

        </section>

    </main>


    <!-- MODAL DE CADASTRO -->
    <div
        id="modalEquipamento"
        class="modal"
    >

        <div class="modal-content">

            <div class="modal-header">

                <h2>Novo equipamento</h2>

                <button
                    type="button"
                    onclick="fecharFormulario()"
                    class="btn-fechar"
                >
                    ×
                </button>

            </div>


            <!-- FORMULÁRIO -->
            <form id="equipamentoForm">

                <!-- NOME -->
                <div class="form-group">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Ex: Caixa de som"
                        required
                    >

                </div>


                <!-- MARCA -->
                <div class="form-group">

                    <label for="marca">
                        Marca
                    </label>

                    <input
                        type="text"
                        id="marca"
                        placeholder="Ex: JBL"
                        required
                    >

                </div>


                <!-- MODELO -->
                <div class="form-group">

                    <label for="modelo">
                        Modelo
                    </label>

                    <input
                        type="text"
                        id="modelo"
                        placeholder="Ex: PartyBox 370"
                        required
                    >

                </div>


                <!-- CATEGORIA -->
                <div class="form-group">

                    <label for="categoria">
                        Categoria
                    </label>

                    <input
                        type="text"
                        id="categoria"
                        placeholder="Ex: Música"
                        required
                    >

                </div>


                <!-- POTÊNCIA -->
                <div class="form-group">

                    <label for="potencia">
                        Potência
                    </label>

                    <input
                        type="number"
                        id="potencia"
                        placeholder="Ex: 220"
                        required
                    >

                </div>


                <!-- MATERIAL -->
                <div class="form-group">

                    <label for="material">
                        Material
                    </label>

                    <input
                        type="text"
                        id="material"
                        placeholder="Ex: Plástico"
                        required
                    >

                </div>


                <!-- PESO -->
                <div class="form-group">

                    <label for="peso">
                        Peso
                    </label>

                    <input
                        type="number"
                        id="peso"
                        placeholder="Ex: 13.00"
                        step="0.01"
                        min="0"
                        required
                    >

                </div>


                <!-- DIMENSÕES -->
                <div class="form-group">

                    <label for="dimensoes">
                        Dimensões
                    </label>

                    <input
                        type="text"
                        id="dimensoes"
                        placeholder="Ex: 30x40x60 cm"
                        required
                    >

                </div>


                <!-- COR -->
                <div class="form-group">

                    <label for="cor">
                        Cor
                    </label>

                    <input
                        type="text"
                        id="cor"
                        placeholder="Ex: Preto"
                        required
                    >

                </div>


                <!-- QUANTIDADE DISPONÍVEL -->
                <div class="form-group">

                    <label for="qtdDisponivel">
                        Quantidade disponível
                    </label>

                    <input
                        type="number"
                        id="qtdDisponivel"
                        placeholder="Ex: 5"
                        min="0"
                        required
                    >

                </div>


                <!-- QUANTIDADE MÍNIMA -->
                <div class="form-group">

                    <label for="qtdMinima">
                        Quantidade mínima
                    </label>

                    <input
                        type="number"
                        id="qtdMinima"
                        placeholder="Ex: 2"
                        min="0"
                        required
                    >

                </div>


                <!-- MENSAGEM -->
                <p id="mensagem"></p>


                <!-- BOTÕES -->
                <div class="form-buttons">

                    <button
                        type="button"
                        class="btn-secondary"
                        onclick="fecharFormulario()"
                    >
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        class="btn-primary"
                    >
                        Cadastrar
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- JAVASCRIPT -->
    <script>

        const equipamentoForm =
            document.getElementById("equipamentoForm");

        const mensagem =
            document.getElementById("mensagem");


        // ABRIR FORMULÁRIO
        function abrirFormulario() {

            document.getElementById("modalEquipamento")
                .style.display = "flex";

        }


        // FECHAR FORMULÁRIO
        function fecharFormulario() {

            document.getElementById("modalEquipamento")
                .style.display = "none";

            equipamentoForm.reset();

            mensagem.textContent = "";

        }


        // CADASTRAR EQUIPAMENTO
        equipamentoForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const token =
                    localStorage.getItem("token");


                // VERIFICA SE EXISTE TOKEN
                if (!token) {

                    mensagem.textContent =
                        "Você precisa fazer login.";

                    mensagem.style.color = "red";

                    return;

                }


                // PEGA OS DADOS DO FORMULÁRIO
                const equipamento = {

                    nome:
                        document.getElementById("nome")
                            .value.trim(),

                    marca:
                        document.getElementById("marca")
                            .value.trim(),

                    modelo:
                        document.getElementById("modelo")
                            .value.trim(),

                    categoria:
                        document.getElementById("categoria")
                            .value.trim(),

                    potencia:
                        Number(
                            document.getElementById("potencia")
                                .value
                        ),

                    material:
                        document.getElementById("material")
                            .value.trim(),

                    peso:
                        Number(
                            document.getElementById("peso")
                                .value
                        ),

                    dimensoes:
                        document.getElementById("dimensoes")
                            .value.trim(),

                    cor:
                        document.getElementById("cor")
                            .value.trim(),

                    quantidadeDisponivel:
                        Number(
                            document.getElementById("qtdDisponivel")
                                .value
                        ),

                    quantidadeMinima:
                        Number(
                            document.getElementById("qtdMinima")
                                .value
                        )

                };


                console.log(
                    "Equipamento enviado:",
                    equipamento
                );


                try {

                    const resposta = await fetch(
                        "http://localhost:8080/equipamentos",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    "Bearer " + token
                            },

                            body:
                                JSON.stringify(equipamento)
                        }
                    );


                    // CADASTRO REALIZADO
                    if (resposta.ok) {

                        mensagem.textContent =
                            "Equipamento cadastrado com sucesso!";

                        mensagem.style.color = "green";


                        equipamentoForm.reset();


                        // Atualiza a tabela
                        carregarEquipamentos();


                        setTimeout(function() {

                            fecharFormulario();

                        }, 1000);

                    }


                    // TOKEN INVÁLIDO
                    else if (resposta.status === 401) {

                        mensagem.textContent =
                            "Sua sessão expirou. Faça login novamente.";

                        mensagem.style.color = "red";

                    }


                    // OUTRO ERRO
                    else {

                        const erro =
                            await resposta.text();

                        console.error(
                            "Erro do backend:",
                            erro
                        );

                        mensagem.textContent =
                            "Erro ao cadastrar equipamento.";

                        mensagem.style.color = "red";

                    }


                } catch (erro) {

                    console.error(
                        "Erro de conexão:",
                        erro
                    );

                    mensagem.textContent =
                        "Não foi possível conectar ao servidor.";

                    mensagem.style.color = "red";

                }

            }
        );


        // LISTAR EQUIPAMENTOS
        async function carregarEquipamentos() {

            const token =
                localStorage.getItem("token");


            if (!token) {
                return;
            }


            try {

                const resposta = await fetch(
                    "http://localhost:8080/equipamentos",
                    {
                        method: "GET",

                        headers: {
                            "Authorization":
                                "Bearer " + token
                        }
                    }
                );


                if (!resposta.ok) {

                    console.error(
                        "Erro ao buscar equipamentos."
                    );

                    return;

                }


                const equipamentos =
                    await resposta.json();


                const lista =
                    document.getElementById(
                        "listaEquipamentos"
                    );


                lista.innerHTML = "";


                equipamentos.forEach(
                    function(equipamento) {

                        const linha =
                            document.createElement("tr");


                        linha.innerHTML = `

                            <td>
                                ${equipamento.idEquipamento}
                            </td>

                            <td>
                                ${equipamento.nome}
                            </td>

                            <td>
                                ${equipamento.marca}
                            </td>

                            <td>
                                ${equipamento.modelo}
                            </td>

                            <td>
                                ${equipamento.categoria}
                            </td>

                            <td>
                                ${equipamento.quantidadeDisponivel}
                            </td>

                            <td>
                                ${equipamento.quantidadeMinima}
                            </td>

                            <td>

                                <button
                                    class="btn-excluir"
                                    onclick="excluirEquipamento(${equipamento.idEquipamento})"
                                >
                                    Excluir
                                </button>

                            </td>

                        `;


                        lista.appendChild(linha);

                    }
                );


            } catch (erro) {

                console.error(
                    "Erro ao carregar equipamentos:",
                    erro
                );

            }

        }


        // EXCLUIR EQUIPAMENTO
        async function excluirEquipamento(id) {

            const token =
                localStorage.getItem("token");


            if (!confirm(
                "Deseja realmente excluir este equipamento?"
            )) {

                return;

            }


            try {

                const resposta = await fetch(
                    `http://localhost:8080/equipamentos/${id}`,
                    {
                        method: "DELETE",

                        headers: {
                            "Authorization":
                                "Bearer " + token
                        }
                    }
                );


                if (resposta.ok) {

                    alert(
                        "Equipamento excluído com sucesso!"
                    );

                    carregarEquipamentos();

                } else {

                    const erro =
                        await resposta.text();

                    console.error(
                        "Erro ao excluir:",
                        erro
                    );

                    alert(
                        "Não foi possível excluir o equipamento."
                    );

                }


            } catch (erro) {

                console.error(
                    "Erro:",
                    erro
                );

                alert(
                    "Não foi possível conectar ao servidor."
                );

            }

        }


        // BUSCA NA TABELA
        document
            .getElementById("campoBusca")
            .addEventListener(
                "input",
                function() {

                    const busca =
                        this.value.toLowerCase();


                    const linhas =
                        document.querySelectorAll(
                            "#listaEquipamentos tr"
                        );


                    linhas.forEach(
                        function(linha) {

                            const texto =
                                linha.textContent
                                    .toLowerCase();


                            if (
                                texto.includes(busca)
                            ) {

                                linha.style.display =
                                    "";

                            } else {

                                linha.style.display =
                                    "none";

                            }

                        }
                    );

                }
            );


        // CARREGA OS EQUIPAMENTOS
        // ASSIM QUE A PÁGINA ABRIR
        carregarEquipamentos();

    </script>

</body>

</html>
